name: Deploy Eclipse Globe to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build NASA total-eclipse catalog
        run: python scripts/build-nasa-catalog.py
      - name: Build Natural Earth continent icons
        run: python scripts/build-continent-icons.py
      - name: Prepare deployment
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path

          build = os.environ['BUILD_NUMBER']

          for filename in ('app.js', 'enhancements.js', 'selection-list.js', 'selector-ui.js'):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              text, count = re.subn(r'const BUILD = \d+;', f'const BUILD = {build};', text, count=1)
              if count != 1:
                  raise SystemExit(f'BUILD constant not found exactly once in {filename}')
              path.write_text(text, encoding='utf-8')

          # Native eclipse identity: app.js writes the catalogue key directly into
          # every ribbon vertex when the geometry is built. Hover never has to
          # infer identity from color, position, selection order or loading order.
          app = Path('app.js')
          app_text = app.read_text(encoding='utf-8')
          native_identity_replacements = [
              (
                  "eclipses = catalog.eclipses.map(meta => {",
                  "eclipses = catalog.eclipses.map((meta, catalogIndex) => {"
              ),
              (
                  "        ...meta,\n        displayDate: formatDate(meta),",
                  "        ...meta,\n        _hoverKey: catalogIndex + 1,\n        displayDate: formatDate(meta),"
              ),
              (
                  "  const colors = [];\n  const indices = [];",
                  "  const colors = [];\n  const eclipseKeys = [];\n  const indices = [];"
              ),
              (
                  "    const vertexOffset = positions.length / 3;\n\n    for (let i = 0; i < sampled.north.length; i += 1) {",
                  "    const vertexOffset = positions.length / 3;\n    const hoverKey = Number(eclipse._hoverKey) || 0;\n\n    for (let i = 0; i < sampled.north.length; i += 1) {"
              ),
              (
                  "      colors.push(color.r, color.g, color.b, color.r, color.g, color.b);\n    }",
                  "      colors.push(color.r, color.g, color.b, color.r, color.g, color.b);\n      eclipseKeys.push(hoverKey, hoverKey);\n    }"
              ),
              (
                  "  geometry.setAttribute('aColor', new THREE.Float32BufferAttribute(colors, 3));\n  geometry.setIndex(indices);",
                  "  geometry.setAttribute('aColor', new THREE.Float32BufferAttribute(colors, 3));\n  geometry.setAttribute('aEclipseKey', new THREE.Float32BufferAttribute(eclipseKeys, 1));\n  geometry.setIndex(indices);"
              ),
          ]
          for old, new in native_identity_replacements:
              if old not in app_text:
                  raise SystemExit(f'Native eclipse identity marker not found: {old[:70]!r}')
              app_text = app_text.replace(old, new, 1)
          app.write_text(app_text, encoding='utf-8')

          # enhancements.js is the hover reader. Its color-based path is now only
          # a legacy fallback for geometries that lack a native key.
          enhancements = Path('enhancements.js')
          enhancements_text = enhancements.read_text(encoding='utf-8')
          enhancements_text = enhancements_text.replace(' * 255)', ' * 1000000)')
          enhancements.write_text(enhancements_text, encoding='utf-8')

          # selection-list.js may style/list selections, but must never overwrite
          # the native key already written by app.js.
          selection_list = Path('selection-list.js')
          selection_text = selection_list.read_text(encoding='utf-8')
          repair_marker = "  function repairRibbonMesh(mesh) {\n    if (!state.colorsReady || !state.THREE) return;"
          repair_replacement = "  function repairRibbonMesh(mesh) {\n    if (mesh?.geometry?.getAttribute?.('aEclipseKey')) return;\n    if (!state.colorsReady || !state.THREE) return;"
          if repair_marker not in selection_text:
              raise SystemExit('selection-list repairRibbonMesh marker not found')
          selection_text = selection_text.replace(repair_marker, repair_replacement, 1)
          selection_list.write_text(selection_text, encoding='utf-8')

          app_text = app.read_text(encoding='utf-8')
          app_hook = "\n".join([
              "",
              "document.addEventListener('eclipse-replace-selection', event => {",
              "  const ids = Array.isArray(event.detail?.ids) ? event.detail.ids : [];",
              "  const requested = new Set(ids);",
              "  selectedIds = new Set(eclipses.filter(eclipse => requested.has(eclipse.id)).map(eclipse => eclipse.id));",
              "  selectedIds.forEach(id => lineAnimationRevision.set(id, (lineAnimationRevision.get(id) || 0) + 1));",
              "  renderCatalog();",
              "  applySelection();",
              "});",
              ""
          ])
          app.write_text(app_text + app_hook, encoding='utf-8')

          def inject_before_iife_end(filename, lines):
              path = Path(filename)
              text = path.read_text(encoding='utf-8').rstrip()
              if not text.endswith('})();'):
                  raise SystemExit(f'{filename} ending not recognized')
              hook = "\n".join(["", *lines, ""])
              path.write_text(text[:-5] + hook + "\n})();\n", encoding='utf-8')

          inject_before_iife_end('selector-ui.js', [
              "  document.addEventListener('eclipse-replace-selection', event => {",
              "    const ids = Array.isArray(event.detail?.ids) ? event.detail.ids : [];",
              "    state.selectedIds = new Set(ids);",
              "    renderDetail();",
              "  });"
          ])

          inject_before_iife_end('selection-list.js', [
              "  document.addEventListener('eclipse-replace-selection', event => {",
              "    const ids = Array.isArray(event.detail?.ids) ? event.detail.ids : [];",
              "    state.selectedIds = new Set(ids.filter(id => state.byId.has(id)));",
              "    if (!state.selectedIds.has(state.focusedId)) state.focusedId = null;",
              "    renderSelection();",
              "  });"
          ])

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          for script in ('enhancements.js', 'selection-list.js', 'app.js'):
              text = re.sub(rf'(\./{re.escape(script)}\?v=)\d+', rf'\g<1>{build}', text)

          marker = '  <script src="./selection-list.js?v='
          for script in ('selector-ui.js', 'panel-controls.js'):
              script_tag = f'  <script src="./{script}?v={build}"></script>\n'
              if f'./{script}?v=' not in text:
                  position = text.find(marker)
                  if position < 0:
                      raise SystemExit('selection-list script marker not found in index.html')
                  text = text[:position] + script_tag + text[position:]
              else:
                  text = re.sub(rf'(\./{re.escape(script)}\?v=)\d+', rf'\g<1>{build}', text)

          text = re.sub(r'^\s*<script src="\./panel-scroll\.js\?v=\d+"></script>\s*\n?', '', text, flags=re.M)
          index.write_text(text, encoding='utf-8')
          print(f'Deploying build {build}')
          PY
      - name: Check JavaScript and icon generator syntax
        run: python -m py_compile scripts/build-continent-icons.py && node --check app.js && node --check enhancements.js && node --check selection-list.js && node --check selector-ui.js && node --check panel-controls.js && node --check period-slider.js && node --check display-selection.js && node --check stable-identity.js && node --check century-labels.js && node --check continent-icons.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
