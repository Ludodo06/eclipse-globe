name: Deploy Eclipse Globe to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build NASA total-eclipse catalog
        run: python scripts/build-nasa-catalog.py
      - name: Inject deployment build number
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path

          build = os.environ['BUILD_NUMBER']

          for filename in ('app.js', 'enhancements.js', 'selection-list.js', 'selector-ui.js'):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              text, count = re.subn(r'const BUILD = \d+;', f'const BUILD = {build};', text, count=1)
              if count != 1:
                  raise SystemExit(f'BUILD constant not found exactly once in {filename}')
              path.write_text(text, encoding='utf-8')

          # Une sélection filtrée est appliquée en une seule opération dans le moteur 3D.
          app = Path('app.js')
          app_text = app.read_text(encoding='utf-8')
          app_text += r'''

document.addEventListener('eclipse-replace-selection', event => {
  const ids = Array.isArray(event.detail?.ids) ? event.detail.ids : [];
  const requested = new Set(ids);
  selectedIds = new Set(
    eclipses.filter(eclipse => requested.has(eclipse.id)).map(eclipse => eclipse.id)
  );
  selectedIds.forEach(id => {
    lineAnimationRevision.set(id, (lineAnimationRevision.get(id) || 0) + 1);
  });
  renderCatalog();
  applySelection();
});
'''
          app.write_text(app_text, encoding='utf-8')

          # Le panneau gauche garde son état de cases synchronisé avec la sélection groupée.
          selector = Path('selector-ui.js')
          selector_text = selector.read_text(encoding='utf-8')
          selector_hook = r'''

  document.addEventListener('eclipse-replace-selection', event => {
    const ids = Array.isArray(event.detail?.ids) ? event.detail.ids : [];
    state.selectedIds = new Set(ids);
    renderDetail();
  });
'''
          if not selector_text.rstrip().endswith('})();'):
              raise SystemExit('selector-ui.js ending not recognized')
          selector_text = selector_text.rstrip()[:-5] + selector_hook + '\n})();\n'
          selector.write_text(selector_text, encoding='utf-8')

          # La liste de droite se synchronise sans reconstruire l'identité des bandes.
          selection_list = Path('selection-list.js')
          selection_text = selection_list.read_text(encoding='utf-8')
          selection_hook = r'''

  document.addEventListener('eclipse-replace-selection', event => {
    const ids = Array.isArray(event.detail?.ids) ? event.detail.ids : [];
    state.selectedIds = new Set(ids.filter(id => state.byId.has(id)));
    if (!state.selectedIds.has(state.focusedId)) state.focusedId = null;
    renderSelection();
  });
'''
          if not selection_text.rstrip().endswith('})();'):
              raise SystemExit('selection-list.js ending not recognized')
          selection_text = selection_text.rstrip()[:-5] + selection_hook + '\n})();\n'
          selection_list.write_text(selection_text, encoding='utf-8')

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          for script in ('enhancements.js', 'selection-list.js', 'app.js'):
              text = re.sub(rf'(\./{re.escape(script)}\?v=)\d+', rf'\g<1>{build}', text)

          # Les modules d'interface préparent le DOM et les contrôles avant selection-list.js et app.js.
          marker = '  <script src="./selection-list.js?v='
          for script in ('selector-ui.js', 'panel-controls.js'):
              script_tag = f'  <script src="./{script}?v={build}"></script>\n'
              if f'./{script}?v=' not in text:
                  position = text.find(marker)
                  if position < 0:
                      raise SystemExit('selection-list script marker not found in index.html')
                  text = text[:position] + script_tag + text[position:]
              else:
                  text = re.sub(rf'(\./{re.escape(script)}\?v=)\d+', rf'\g<1>{build}', text)

          # L'ancien correctif de molette n'est plus chargé : scroll natif du panneau entier.
          text = re.sub(r'^\s*<script src="\./panel-scroll\.js\?v=\d+"></script>\s*\n?', '', text, flags=re.M)

          index.write_text(text, encoding='utf-8')
          print(f'Deploying build {build}')
          PY
      - name: Check JavaScript syntax
        run: node --check app.js && node --check enhancements.js && node --check selection-list.js && node --check selector-ui.js && node --check panel-controls.js && node --check period-slider.js && node --check display-selection.js && node --check stable-identity.js && node --check century-labels.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
