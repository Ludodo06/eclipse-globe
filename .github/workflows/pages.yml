name: Deploy Eclipse Globe to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check NASA path endpoint
        run: |
          python - <<'PY'
          import urllib.request
          url='https://eclipse.gsfc.nasa.gov/SEsearch/eclipse-path-data.js.php?Ecl=20260812&Spc=0.5'
          req=urllib.request.Request(url, headers={'Origin':'https://ludodo06.github.io','User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req, timeout=30) as r:
              body=r.read().decode('utf-8','replace')
              print('STATUS', r.status)
              print('HEADERS')
              for k,v in r.headers.items():
                  if k.lower() in {'access-control-allow-origin','content-type','content-length','cache-control'}: print(k+':',v)
              print('LENGTH',len(body))
              print('PREFIX',body[:3000])
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
