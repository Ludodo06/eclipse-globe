name: Deploy Eclipse Globe to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Inspect NASA path scripts
        run: |
          python - <<'PY'
          import urllib.request, re
          urls = {
            'loader':'https://eclipse.gsfc.nasa.gov/SEsearch/eclipse-path-loader.js',
            'calc':'https://eclipse.gsfc.nasa.gov/SEgoogle/SEcirc_bryan-maplibre.js'
          }
          for name,url in urls.items():
              text=urllib.request.urlopen(url, timeout=30).read().decode('utf-8','replace')
              print(f'===== {name} LENGTH {len(text)} =====')
              if name=='loader':
                  print(text[:30000])
              else:
                  for m in re.finditer(r'(?m)^(?:function\s+\w+|const\s+\w+\s*=|let\s+\w+\s*=|var\s+\w+\s*=).*', text):
                      line=m.group(0)
                      if any(k in line.lower() for k in ['path','limit','central','eclipse','circ','bessel','draw','line','lat','lng','lon']): print(line[:500])
                  print('--- endpoint/data references ---')
                  for x in sorted(set(re.findall(r'[A-Za-z0-9_./-]+(?:\.php|\.json|\.csv|\.txt)(?:\?[^"\'\s<]*)?', text))): print(x)
                  print('--- selected function bodies ---')
                  keys=['getpath','draw','central','limit','north','south','bessel','circ']
                  lines=text.splitlines()
                  for i,line in enumerate(lines):
                      if line.lstrip().startswith('function ') and any(k in line.lower() for k in keys):
                          print('\n'.join(lines[i:i+80]))
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
