name: Deploy Eclipse Globe to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Inspect NASA path script calls
        run: |
          python - <<'PY'
          import urllib.request, re
          url='https://eclipse.gsfc.nasa.gov/SEsearch/eclipse-path-data.js.php?Ecl=20260812&Spc=0.5'
          body=urllib.request.urlopen(url, timeout=30).read().decode('utf-8','replace')
          print('MAP_METHODS', sorted(set(re.findall(r'map\.([A-Za-z_$][\w$]*)\s*\(', body))))
          for line in body.splitlines():
              if 'map.' in line or 'northernLimitCoords' in line or 'centralLimitCoords' in line or 'southernLimitCoords' in line:
                  print(line[:1600])
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
